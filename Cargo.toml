[workspace]
resolver = "3"
members = [
  "crates/pawdf_core",
  "crates/pawdf_reader",
  "crates/pawdf_pyo3"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
miniz_oxide = "0.9.1"
pawdf_core = { path = "crates/pawdf_core" }
pawdf_reader = { path = "crates/pawdf_reader" }
