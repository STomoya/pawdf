[workspace]
resolver = "3"
members = [
  "crates/pawdf_core",
  "crates/pawdf_reader",
  "crates/pawdf_pyo3"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
miniz_oxide = "0.9.1"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "glyph-names"] }
md-5 = "0.11.0"
sha2 = "0.11.1"
rc4 = "0.2.0"
aes = "0.9.3"
cbc = "0.2.1"
stringprep = "0.1.5"
pawdf_core = { path = "crates/pawdf_core" }
pawdf_reader = { path = "crates/pawdf_reader" }
