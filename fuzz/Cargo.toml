[package]
name = "pawdf_fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
pawdf_core = { path = "../crates/pawdf_core" }
pawdf_reader = { path = "../crates/pawdf_reader" }

# Keep this crate out of the main workspace; it builds only with nightly.
[workspace]

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

